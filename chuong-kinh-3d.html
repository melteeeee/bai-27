<script>
// Standalone procedural 3D: signed-distance geometry, ray tracing, refraction.
// No external assets, libraries or network requests. Dimensions are inferred
// from the reference image and are not manufacturing measurements.
(()=>{'use strict';
const canvas=document.getElementById('scene'),error=document.getElementById('error');
const gl=canvas.getContext('webgl',{antialias:false,alpha:false,preserveDrawingBuffer:true});
function fail(message){error.hidden=false;error.textContent=message;}
if(!gl){fail('Trình duyệt này chưa bật WebGL. Hãy mở file bằng Chrome, Edge hoặc Safari có hỗ trợ tăng tốc đồ họa.');return;}
const vertex=`attribute vec2 position;void main(){gl_Position=vec4(position,0.,1.);}`;
const fragment=`
precision highp float;
uniform vec2 resolution;
uniform vec3 eye;
uniform vec3 target;
uniform float floorVisible;
uniform float smoothEdges;
uniform sampler2D meterTexture;
const float PETRI_RADIUS=.477;
const vec3 PETRI_CENTER=vec3(-1.55,0.,1.35);
const vec3 SPROUT_CENTER=vec3(3.0,0.,1.35);
const vec3 DRY_CENTER=vec3(4.25,0.,1.35);
const vec3 LIME_CENTER=vec3(3.2,0.,-.80);
const float BEAKER_RADIUS=PETRI_RADIUS*.85;
const vec3 BEAKER_CENTER=vec3(2.1,0.,-.80);
float ellipsoid(vec3 p,vec3 r){float k0=length(p/r);float k1=length(p/(r*r));return k0*(k0-1.)/max(k1,.0001);}
float torus(vec3 p,float r,float t){return length(vec2(length(p.xz)-r,p.y))-t;}
float cylinder(vec3 p,float r,float h){vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h);return min(max(d.x,d.y),0.)+length(max(d,0.));}
// A shallow open dish: continuous glass bottom, thin cylindrical wall,
// and a rounded upper rim. Its OUTER radius is exactly PETRI_RADIUS.
float petriShape(vec3 p){
 vec3 q=p-PETRI_CENTER;
 float outside=cylinder(q-vec3(0.,.09,0.),PETRI_RADIUS-.006,.084)-.006;
 float cavity=cylinder(q-vec3(0.,.164,0.),PETRI_RADIUS-.024,.136);
 float dish=max(outside,-cavity);
 float lip=torus(q-vec3(0.,.168,0.),PETRI_RADIUS-.012,.012);
 return min(dish,lip);
}
// Open beaker with a thick base and rounded lip. The localized warp
// at the upper left pulls the entire wall and lip into a pouring spout.
float beakerShape(vec3 p){
 vec3 q=p-BEAKER_CENTER;
 float spout=.055*smoothstep(.82,1.06,q.y)*exp(-q.z*q.z/.009)*(1.-smoothstep(-.18,-.06,q.x));
 q.x+=spout;
 float outside=cylinder(q-vec3(0.,.54,0.),BEAKER_RADIUS-.025,.515)-.025;
 float cavity=cylinder(q-vec3(0.,.64,0.),BEAKER_RADIUS-.048,.555)-.018;
 float wall=max(outside,-cavity);
 float rim=torus(q-vec3(0.,1.065,0.),BEAKER_RADIUS-.008,.015);
 return min(wall,rim)*.65;
}
// White printed graduation marks; decorative, not a calibrated scale.
float beakerMarks(vec3 p){
 vec3 q=p-BEAKER_CENTER;
 float radius=length(q.xz),angle=atan(q.x,q.z);
 float surface=1.-smoothstep(.003,.008,abs(radius-BEAKER_RADIUS));
 float rows=1.-smoothstep(.004,.007,abs(mod(q.y-.23+.0675,.135)-.0675));
 float range=smoothstep(.20,.215,q.y)*(1.-smoothstep(.91,.93,q.y));
 float ticks=rows*range*smoothstep(.10,.12,angle)*(1.-smoothstep(.53,.55,angle));
 float spine=(1.-smoothstep(.008,.016,abs(angle-.12)))*range;
 return max(ticks,spine)*surface;
}
float boxShape(vec3 p,vec3 b){vec3 d=abs(p)-b;return length(max(d,0.))+min(max(d.x,max(d.y,d.z)),0.);}
vec2 closest(vec2 a,vec2 b){return a.x<b.x?a:b;}
vec3 seedCell(vec3 q){return vec3(mod(q.x+.046,.092)-.046,q.y,mod(q.z+.046,.092)-.046);}
float seeds(vec3 p,bool inCup){
 vec3 q=p-(inCup?BEAKER_CENTER:PETRI_CENTER);
 float mid=inCup?.21:.072;
 float halfHeight=inCup?.135:.047;
 float limit=cylinder(q-vec3(0.,mid,0.),inCup?.327:.407,halfHeight);
 if(limit>.08)return limit;
 vec3 cell=seedCell(q);cell.y=inCup?mod(q.y-.075,.081)-.0405:q.y-mid;
 float id=sin(dot(floor((q.xz+.046)/.092),vec2(23.7,91.3)))*.5+.5;
 float a=id*2.5;cell.xz=mat2(cos(a),-sin(a),sin(a),cos(a))*cell.xz;
 return max(ellipsoid(cell,vec3(.034,.032,.044)),limit);
}
float sprouts(vec3 p){
 vec3 q=p-PETRI_CENTER;float bound=cylinder(q-vec3(0.,.17,0.),.408,.12);
 if(bound>.06)return bound;
 vec3 cell=seedCell(q);float t=clamp((q.y-.105)/.16,0.,1.);
 cell.x-=.022*sin(t*5.);cell.z-=.020*sin(t*3.);
 float stem=max(length(cell.xz)-.007,abs(q.y-.185)-.08);
 return max(stem,bound);
}
float waterShape(vec3 p){return cylinder(p-LIME_CENTER-vec3(0.,.345,0.),BEAKER_RADIUS-.037,.27);}
// Flat, circular absorbent paper with a softly rounded, thin edge.
const vec3 PAPER_CENTER=vec3(.65,.008,1.35);
const float PAPER_RADIUS=.425;
float paperShape(vec3 p){return cylinder(p-PAPER_CENTER,PAPER_RADIUS-.002,.004)-.002;}
// Additional apparatus: dimensions are illustrative, not calibrated volumes.
float capsule(vec3 p,vec3 a,vec3 b,float r){vec3 q=p-a,v=b-a;return length(q-v*clamp(dot(q,v)/dot(v,v),0.,1.))-r;}
float flask(vec3 q){
 float r=mix(.44,.15,clamp((q.y-.10)/.80,0.,1.));
 float outside=max(length(q.xz)-r,max(.015-q.y,q.y-1.34));
 float inner=max(length(q.xz)-(r-.027),max(.060-q.y,q.y-1.4));
 float wall=max(outside,-inner)*.65;
 return min(wall,torus(q-vec3(0.,1.30,0.),.15,.026));
}
vec2 extras(vec3 p){
 vec2 h=vec2(100.,9.);
 // A finite table with a wood top and four dark metal legs.
 if(floorVisible>.5){
  h=vec2(boxShape(p-vec3(.0,-.12,.15),vec3(4.85,.10,2.35))-.02,9.);
  vec3 leg=p-vec3(0.,-1.30,.15);leg.xz=abs(leg.xz)-vec2(4.40,1.90);
  h=closest(h,vec2(boxShape(leg,vec3(.075,1.08,.075)),11.));
 }
 // Desk lamp: base, bent arm, hollow tilted shade, bulb.
 vec3 q=p-vec3(-3.90,0.,-.80);
 float base=cylinder(q-vec3(0.,.10,0.),.46,.09)-.01;
 h=closest(h,vec2(base,10.));
 float arm=min(capsule(q,vec3(0.,.16,0.),vec3(.02,1.7,-.10),.045),capsule(q,vec3(.02,1.7,-.10),vec3(.48,2.10,-.05),.045));
 h=closest(h,vec2(arm,11.));
 vec3 shade=q-vec3(.58,1.98,.02);shade.xy=mat2(.80,-.60,.60,.80)*shade.xy;
 float sr=mix(.39,.13,clamp((shade.y+.22)/.48,0.,1.));
 float outer=max(length(shade.xz)-sr,abs(shade.y-.02)-.24);
 float inner=max(length(shade.xz)-(sr-.025),abs(shade.y+.005)-.25);
 h=closest(h,vec2(max(outer,-inner)*.7,10.));
 h=closest(h,vec2(length(shade-vec3(0.,-.13,0.))-.13,23.));
 // Roll of cling film in a yellow dispenser, with a short clear sheet.
 q=p-vec3(-2.15,0.,-.80);
 float carton=boxShape(q-vec3(0.,.15,0.),vec3(.90,.14,.24))-.01;
 h=closest(h,vec2(carton,12.));
 h=closest(h,vec2(cylinder(vec3(q.y-.31,q.x,q.z),.13,.83),24.));
 h=closest(h,vec2(boxShape(q-vec3(0.,.014,.47),vec3(.79,.006,.20)),1.));
 // Two stoppered Erlenmeyer flasks in the back row.
 vec3 f1=p-vec3(0.,0.,-.80),f2=p-vec3(1.05,0.,-.80);
 h=closest(h,vec2(min(flask(f1),flask(f2)),1.));
 h=closest(h,vec2(min(cylinder(f1-vec3(0.,1.36,0.),.145,.10),cylinder(f2-vec3(0.,1.36,0.),.145,.10)),13.));
 // Laboratory CO2 kit: landscape logger, separate blue probe and red lead.
 vec3 kit=p+vec3(1.95,0.,1.07);
 q=kit-vec3(-1.85,0.,2.22);
 float logger=boxShape(q-vec3(0.,.115,0.),vec3(.61,.045,.32))-.07;
 float screenCut=boxShape(q-vec3(0.,.24,-.015),vec3(.49,.035,.225))-.015;
 logger=max(logger,-screenCut);
 h=closest(h,vec2(logger,14.));
 h=closest(h,vec2(boxShape(q-vec3(0.,.207,-.015),vec3(.49,.009,.225))-.010,15.));
 h=closest(h,vec2(boxShape(q-vec3(0.,.028,0.),vec3(.60,.012,.31))-.025,11.));
 // External probe housing, red identification panel and black sensing stem.
 vec3 probe=kit-vec3(-.72,0.,2.30);
 h=closest(h,vec2(boxShape(probe-vec3(0.,.105,0.),vec3(.18,.075,.28))-.02,25.));
 h=closest(h,vec2(boxShape(probe-vec3(0.,.199,0.),vec3(.105,.006,.19))-.012,26.));
 h=closest(h,vec2(capsule(probe,vec3(0.,.105,-.29),vec3(0.,.105,-.69),.042),11.));
 for(int i=0;i<3;i++){
  vec3 ring=probe-vec3(0.,.105,-.43-float(i)*.075);
  h=closest(h,vec2(torus(vec3(ring.x,ring.z,ring.y),.042,.006),14.));
 }
 h=closest(h,vec2(length(probe-vec3(0.,.105,-.70))-.047,14.));
 // Two oblong cable loops laid flat, joined to both instruments.
 vec3 c1=kit-vec3(-1.85,.034,2.94),c2=kit-vec3(-1.78,.038,3.15);
 float loop1=(length(vec2(length(c1.xz/vec2(.70,.14))-1.,c1.y/.14))-.12)*.14;
 float loop2=(length(vec2(length(c2.xz/vec2(.70,.14))-1.,c2.y/.14))-.12)*.14;
 float lead=capsule(kit,vec3(-2.50,.10,2.22),vec3(-2.55,.034,2.94),.017);
 lead=min(lead,capsule(kit,vec3(-1.15,.034,2.94),vec3(-1.08,.038,3.15),.017));
 lead=min(lead,capsule(kit,vec3(-2.48,.038,3.15),vec3(-.72,.045,2.78),.017));
 lead=min(lead,capsule(kit,vec3(-.72,.045,2.78),vec3(-.72,.105,2.60),.017));
 h=closest(h,vec2(min(min(loop1,loop2),lead),16.));
 // Matchbox and three visible wooden matches beside it.
 q=p-vec3(-.45,0.,1.35);
 h=closest(h,vec2(boxShape(q-vec3(0.,.07,0.),vec3(.21,.065,.30))-.005,17.));
 for(int i=0;i<6;i++){float x=-.15+float(i)*.06;h=closest(h,vec2(capsule(q,vec3(x,.15,-.19),vec3(x,.15,.22),.012),24.));h=closest(h,vec2(length(q-vec3(x,.15,-.19))-.023,18.));}
 // Folded cloth seed bag with a drawstring.
 q=p-vec3(1.80,0.,1.35);
 float cloth=boxShape(q-vec3(0.,.045,0.),vec3(.38,.027,.45))-.018;
 h=closest(h,vec2(cloth,19.));
 h=closest(h,vec2(min(capsule(q,vec3(-.25,.075,-.39),vec3(.25,.075,-.39),.008),capsule(q,vec3(.25,.075,-.39),vec3(.48,.04,-.57),.009)),19.));
 // Wash bottle of filtered water, with its characteristic bent nozzle.
 q=p-vec3(4.35,0.,-.80);
 float bottle=cylinder(q-vec3(0.,.48,0.),.28,.42)-.045;
 bottle=min(bottle,cylinder(q-vec3(0.,.98,0.),.125,.12));
 h=closest(h,vec2(bottle,20.));
 h=closest(h,vec2(min(capsule(q,vec3(0.,1.08,0.),vec3(-.08,1.34,0.),.025),capsule(q,vec3(-.08,1.34,0.),vec3(-.34,1.42,0.),.025)),20.));
 // Back-row limewater beaker, then the two front-row specimen dishes.
 h=closest(h,vec2(beakerShape(p-LIME_CENTER+BEAKER_CENTER),1.));
 h=closest(h,vec2(petriShape(p-SPROUT_CENTER+PETRI_CENTER),1.));
 h=closest(h,vec2(seeds(p-SPROUT_CENTER+PETRI_CENTER,false),22.));
 h=closest(h,vec2(sprouts(p-SPROUT_CENTER+PETRI_CENTER),4.));
 h=closest(h,vec2(petriShape(p-DRY_CENTER+PETRI_CENTER),1.));
 h=closest(h,vec2(seeds(p-DRY_CENTER+PETRI_CENTER,false),2.));
 return h;
}
vec2 sceneMap(vec3 p){
 vec2 hit=closest(vec2(min(petriShape(p),beakerShape(p)),1.),extras(p));
 hit=closest(hit,vec2(abs(waterShape(p)),7.));
 hit=closest(hit,vec2(paperShape(p),8.));
 return hit;
}
float shape(vec3 p){return sceneMap(p).x;}
vec3 opaqueColor(vec3 p,float material){
 if(material>25.5){vec3 q=p-vec3(-2.67,.199,1.23);float stripe=(1.-smoothstep(.003,.007,abs(mod(q.x+.06,.036)-.018)))*step(abs(q.z),.10);return mix(vec3(.55,.055,.025),vec3(.95,.84,.65),stripe*.8);}
 if(material>24.5)return vec3(.21,.20,.55);
 if(material>22.5&&material<23.5)return vec3(1.6,1.45,1.05);
 if(material>23.5)return vec3(.74,.64,.44);
 if(material>21.5)return vec3(.29,.37,.045);
 if(material>19.5)return vec3(.84,.90,.86);
 if(material>18.5){float weave=sin(p.x*180.)*sin(p.z*180.)*.035;return vec3(.85,.83,.71)+weave;}
 if(material>17.5)return vec3(.45,.06,.025);
 if(material>16.5){vec3 q=p-vec3(-.45,0.,1.35);return abs(q.x)>.19?vec3(.20,.12,.08):vec3(.65,.19,.07);}
 if(material>15.5)return vec3(.60,.025,.018);
 if(material>14.5){vec3 q=p-vec3(-3.80,.207,1.135);vec2 uv=clamp(vec2(q.x/1.0+.5,.5-q.z/.47),0.,1.);return texture2D(meterTexture,uv).rgb;}
 if(material>13.5)return vec3(.91,.93,.90);
 if(material>12.5)return vec3(.37,.15,.06);
 if(material>11.5)return vec3(.83,.65,.08);
 if(material>10.5)return vec3(.13,.17,.18);
 if(material>9.5)return vec3(.69,.30,.40);
 if(material>8.5){float grain=sin(p.x*5.+sin(p.z*2.)*.6)*.022+sin(p.x*95.+p.z*3.)*.006;vec3 wood=vec3(.47,.32,.19)+grain;float contact=1.-.18*exp(-dot(p.xz,p.xz)/1.3);return wood*contact;}
 if(material>7.5){vec3 q=p-PAPER_CENTER;float grain=sin(q.x*240.+sin(q.z*161.))*sin(q.z*211.)*.006;return vec3(.89,.93,.94)+grain;}
 if(material<2.5){vec3 q=p-DRY_CENTER;float seedId=fract(sin(dot(floor((q.xz+.046)/.092),vec2(32.1,71.2)))*451.8);vec3 c=mix(vec3(.17,.25,.035),vec3(.43,.46,.075),seedId);vec3 cell=seedCell(q);float seam=(1.-smoothstep(.003,.008,abs(cell.x)))*(1.-smoothstep(.015,.026,abs(cell.z)));return mix(c,vec3(.71,.68,.36),seam*.65);}
 if(material<4.5)return vec3(.88,.88,.64);
 return vec3(.9);

}
vec3 normal(vec3 p){vec2 e=vec2(.0004,0.);if(sceneMap(p).y>6.5&&sceneMap(p).y<7.5)return normalize(vec3(waterShape(p+e.xyy)-waterShape(p-e.xyy),waterShape(p+e.yxy)-waterShape(p-e.yxy),waterShape(p+e.yyx)-waterShape(p-e.yyx)));return normalize(vec3(shape(p+e.xyy)-shape(p-e.xyy),shape(p+e.yxy)-shape(p-e.yxy),shape(p+e.yyx)-shape(p-e.yyx)));}
vec2 bounds(vec3 ro,vec3 rd){vec3 inv=1./(rd+vec3(.0000001));vec3 a=(vec3(-4.90,-2.50,-2.25)-ro)*inv;vec3 b=(vec3(4.90,2.65,2.55)-ro)*inv;vec3 lo=min(a,b),hi=max(a,b);return vec2(max(max(lo.x,lo.y),lo.z),min(min(hi.x,hi.y),hi.z));}
float trace(vec3 ro,vec3 rd){vec2 box=bounds(ro,rd);float t=max(0.,box.x);if(box.y<t)return -1.;for(int i=0;i<192;i++){float d=abs(shape(ro+rd*t));if(d<.0002)return t;t+=max(d*.78,.00015);if(t>box.y+.01)break;}return -1.;}
float panel(vec3 ro,vec3 rd,vec3 center,vec3 axis,vec2 size){
 vec3 n=normalize(center-vec3(0.,1.8,0.));float den=dot(rd,n);float t=dot(center-ro,n)/den;if(t<0.)return 0.;
 vec3 u=normalize(cross(axis,n)),v=cross(n,u),p=ro+rd*t-center;
 vec2 q=abs(vec2(dot(p,u),dot(p,v)))-size;
 return (1.-smoothstep(-.05,.05,q.x))*(1.-smoothstep(-.12,.12,q.y));
}
vec3 environment(vec3 ro,vec3 rd){
 vec3 color=mix(vec3(.045,.16,.16),vec3(.28,.40,.36),smoothstep(-.4,.65,rd.y));
 float a=panel(ro,rd,vec3(-3.8,2.6,2.5),vec3(0.,1.,0.),vec2(.36,2.1));
 float b=panel(ro,rd,vec3(3.6,2.5,1.3),vec3(0.,1.,0.),vec2(.22,1.9));
 float c=panel(ro,rd,vec3(-.5,5.,-.5),vec3(0.,0.,1.),vec2(1.5,.65));
 float d=panel(ro,rd,vec3(1.2,2.8,-4.),vec3(0.,1.,0.),vec2(.55,1.6));
 color+=vec3(3.8,3.95,4.)*a+vec3(3.3,3.45,3.2)*b+vec3(2.5,2.45,2.25)*c+vec3(1.8,2.,1.9)*d;
 return color;

vec3 background(vec3 ro,vec3 rd){
